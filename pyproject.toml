[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmem"
version = "0.2.0"
description = "Controlled Bash and KeyRooms environments for agent instruction adherence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
keyrooms = ["minigrid==3.0.0", "gymnasium==1.2.0"]

[project.scripts]
agentmem-bash = "environments.bash.__main__:main"
agentmem-keyrooms = "environments.keyrooms.__main__:main"

[tool.setuptools.packages.find]
include = ["agent*", "environments*", "experiments*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
experiments = ["docker/Dockerfile", "docker/*.py", "history_examples/*.json"]
