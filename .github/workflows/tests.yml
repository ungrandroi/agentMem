name: tests
on: [push, pull_request]
jobs:
  environments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[keyrooms]'
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s environments/bash/tests -v
      - run: docker build -t agentmem-repair:1 experiments/docker
      - run: python -m unittest discover -s experiments/tests -v
        env:
          RUN_RULE_DOCKER_TESTS: '1'
          RULE_DOCKER_CONTEXT: default
      - run: python -m environments.bash --client reference --pressure medium --output runs/bash-reference.json
      - run: python -m environments.keyrooms generate --kind backtracking --rooms 4 --seed 100000 --output runs/example
